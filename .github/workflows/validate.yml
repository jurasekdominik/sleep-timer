name: Validate
on:
  push:
    branches: [main, WPF]
    tags: ['v*']
    paths-ignore: ['assets/screenshot*.png', 'README.md']
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: bash scripts/check-timers.sh
  windows:
    needs: logic
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - shell: pwsh
        run: ./scripts/build-native.ps1
      - run: dotnet build SleepTimer.csproj -c Release --nologo -warnaserror
      - shell: pwsh
        run: ./scripts/check-windows.ps1
        env:
          SLEEP_TIMER_NATIVE_REQUIRED: '1'
      - name: Measure executable and verify standalone startup
        shell: pwsh
        run: |
          $exe = Get-Item bin/Release/net48/SleepTimer.exe
          $size = "SleepTimer.exe: $($exe.Length) bytes ($([math]::Round($exe.Length / 1024, 1)) KiB)"
          Write-Output $size
          New-Item validation-output -ItemType Directory -Force | Out-Null
          $size | Set-Content validation-output/size.txt
          $size | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $standalone = Join-Path $env:RUNNER_TEMP 'sleep-timer-standalone'
          New-Item $standalone -ItemType Directory -Force | Out-Null
          Copy-Item $exe.FullName (Join-Path $standalone 'SleepTimer.exe')
          $process = Start-Process (Join-Path $standalone 'SleepTimer.exe') -ArgumentList '--verify-startup' -PassThru
          if (-not $process.WaitForExit(15000)) { $process.Kill(); throw 'Standalone executable did not complete startup check' }
          if ($process.ExitCode -ne 0) { throw "Standalone startup failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: SleepTimer
          path: |
            bin/Release/net48/SleepTimer.exe
            validation-output/
      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $repo = '${{ github.repository }}'
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag bin/Release/net48/SleepTimer.exe --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset update failed' }
            gh release edit $tag --repo $repo --title "Sleep Timer $version" --notes-file CHANGELOG.md --latest
          } else {
            gh release create $tag bin/Release/net48/SleepTimer.exe --repo $repo --verify-tag --title "Sleep Timer $version" --notes-file CHANGELOG.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
